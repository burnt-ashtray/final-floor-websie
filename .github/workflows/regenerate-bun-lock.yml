name: Regenerate Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - "app/package.json"
      - "app/packages/**/package.json"
      - ".github/workflows/regenerate-bun-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-bun-lock-main
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Regenerate Bun lockfile
        working-directory: app
        run: bun install

      - name: Commit lockfile if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock is already synchronized."
            exit 0
          fi
          git commit -m "Regenerate Bun lockfile for aligned React types"
          git push origin HEAD:main
