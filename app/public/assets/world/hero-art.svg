<!-- pendant shadow and star -->
<ellipse cx="800" cy="675" rx="175" ry="42" fill="#000" opacity=".8" filter="url(#shadow)"/>
<g transform="translate(800 655)"><path d="M0 -195 L28 -42 L148 0 L28 34 L0 190 L-28 34 L-148 0 L-28 -42Z" fill="#08080a" stroke="#202126" stroke-width="24"/><path d="M0 -195 L28 -42 L148 0 L28 34 L0 190 L-28 34 L-148 0 L-28 -42Z" fill="url(#steel)" stroke="#d6d8de" stroke-width="4"/><path d="M0 -156 L15 -22 L114 0 L15 22 L0 150 L-15 22 L-114 0 L-15 -22Z" fill="#111215" stroke="#f6f6f8" stroke-width="2"/><circle r="31" fill="#08090b" stroke="url(#steel)" stroke-width="8"/><circle r="9" fill="#fff"/></g>
<!-- fine metal scratch lines -->
<g stroke="#e9e9ec" stroke-opacity=".2" stroke-width="2"><path d="M270 460 l150 100 M1180 440 l-160 90 M440 840 l90 -20 M1080 830 l80 35"/><path d="M630 550 l-80 140 M980 520 l90 130"/></g>
